# SecureBank sshd baseline — Module 1 (C-01, C-04) + review T-01/T-10/T-11/T-12/T-15
# ----------------------------------------------------------------------------------
# C-01: no direct root SSH — admins log in as a normal user and use sudo.
# C-04: password auth is TEMPORARY (learning). Module 4 switches to
#       key-only auth + fail2ban. Do not use outside the isolated lab.
# T-15: when key-only lands, flip BOTH PasswordAuthentication AND
#       KbdInteractiveAuthentication to no — they are separate switches,
#       and PAM keyboard-interactive would otherwise still accept passwords.
#
# AllowUsers is rendered by scripts/setup.sh from lab.env at the repo root
# (SB_ADMIN_USER) so the config can never diverge from the variable.

PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication yes   # matches password policy for now; flip with PasswordAuthentication in Module 4 (T-15)
MaxAuthTries 4
AllowUsers securebank-admin        # rendered from lab.env by setup.sh (T-01)
PermitEmptyPasswords no            # explicit: password auth is on, so forbid empty passwords (T-01)
AllowAgentForwarding no            # cuts SSH-agent pivoting during pentest stages (T-01)
PubkeyAuthentication yes           # explicit — key provisioning is live (T-10)
LoginGraceTime 60                  # T-11
MaxStartups 5:30:60                # T-11
UseDNS no                          # T-11 — no reverse-DNS lookups at login
GSSAPIAuthentication no            # T-11 — unused mechanism
Banner /etc/issue.net              # T-12 — authorized-use banner
