# SecureBank network-hardening sysctl baseline (C-09, review T-09)
# -----------------------------------------------------------------
# Applied idempotently by scripts/setup.sh (copied to
# /etc/sysctl.d/99-securebank.conf, then `sysctl --system`).
# Keep IPv6 enabled but hardened — it is filtered by the nftables default
# deny (T-07), so we do NOT set disable_ipv6 here.

# Reverse-path filtering (anti-spoofing), all interfaces
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects / source routing (mitigate MITM on the lab segment)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log martian packets (visibility for Stages 7/8)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# SYN cookies (mitigate SYN-flood resource exhaustion)
net.ipv4.tcp_syncookies = 1
