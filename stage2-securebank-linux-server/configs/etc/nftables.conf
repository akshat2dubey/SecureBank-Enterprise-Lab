#!/usr/sbin/nft -f

# SecureBank lab firewall — default deny (C-08, review T-06/T-07)
# -----------------------------------------------------------------
# Applied idempotently by scripts/setup.sh (rendered: @SB_LAB_SUBNET@ is
# replaced with the value from lab.env at the repo root). The same file is loaded at
# boot by the nftables service. Extend this file in Module 4 for real
# services — never hand-edit the copy on the box.
#
# Policy: outbound allowed (package updates via the NAT NIC), inbound
# default-deny. Covers BOTH IPv4 and IPv6 (T-07) — IPv6 stays enabled and is
# filtered here rather than disabled.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    # Return traffic for our own connections (updates, DNS, SSH)
    ct state established,related accept

    # Loopback
    iif "lo" accept

    # DHCP client replies (Module 1 uses DHCP; Module 2 moves to static IPs)
    udp sport 67 dport 68 accept

    # ICMP echo (ping — Stage 1 traffic script)
    icmp type echo-request accept

    # ICMPv6: echo + neighbor discovery (IPv6 will not work without ND)
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, \
                  nd-router-solicit, nd-router-advert } accept

    # SSH from the lab segment only (IPv4 from lab.env; link-local v6)
    ip saddr @SB_LAB_SUBNET@ tcp dport 22 accept
    ip6 saddr fe80::/10 tcp dport 22 accept

    # Log dropped inbound traffic (rate-limited) to journald/syslog — the
    # audit trail Stage 7/8 read. No verdict: traffic continues to the
    # policy drop below. Limit keeps the log usable.
    log prefix "SB-DROP " limit rate 5/second burst 10 packets
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
