# SecureBank host audit — managed by scripts/setup.sh (C-15).
# Keep the journal on disk (persistent) so Stage 8 incident response can
# reconstruct what happened even after a reboot. Without this, journald
# keeps logs only in RAM (volatile) and they are lost.
# The journal is the forwarder's source for syslog/RFC 5424 to the Stage 7
# SIEM (INTEGRATION.md section 5).

[Journal]
Storage=persistent
