# Disable cloud-init's network configuration (Module 2)
# -------------------------------------------------------
# Installed by scripts/setup.sh on cloud-init-bearing images (Ubuntu cloud
# images, most Proxmox/Terraform templates). Cloud-init would overwrite the
# static Module 2 NIC config on every boot — this empty file (the documented
# opt-out) stops it. Idempotent: re-running setup recreates it identically.
# The box copy is generated (not rendered from lab.env), so drift detection
# skips it — the verify suite instead checks that networkd still owns the
# lab NIC after reboot.
